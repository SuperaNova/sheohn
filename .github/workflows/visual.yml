name: Visual Regression

# Screenshots are generated and compared on ubuntu only; do not commit baselines
# from another OS. update-snapshots uploads new baselines as an artifact to
# review and commit by hand.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'playwright.visual.config.ts'
      - '.github/workflows/visual.yml'
  workflow_dispatch:

permissions:
  contents: read

# Stubs so the build can import API routes; no external calls are made.
env:
  GOOGLE_GENERATIVE_AI_API_KEY: stub
  UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
  UPSTASH_VECTOR_REST_TOKEN: stub
  UPSTASH_REDIS_REST_URL: https://stub.upstash.io
  UPSTASH_REDIS_REST_TOKEN: stub
  RESEND_API_KEY: stub

jobs:
  compare:
    name: Compare against committed baselines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers (Chromium only)
        # Single engine keeps rendering deterministic.
        run: npx playwright install --with-deps chromium

      - name: Run visual regression suite
        run: npx playwright test --config=playwright.visual.config.ts

      - name: Upload HTML report + diff images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  update-snapshots:
    name: Regenerate baseline snapshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshots
        run: npx playwright test --config=playwright.visual.config.ts --update-snapshots

      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baseline-snapshots
          path: tests/visual/**/*-snapshots/**
          retention-days: 14
