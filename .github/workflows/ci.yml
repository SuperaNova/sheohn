name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'astro.config.*'
      - 'svelte.config.*'
      - 'eslint.config.*'
      - 'knip.json'
      - 'vitest.config.*'
      - 'playwright*.config.ts'
      - '.size-limit.js'
      - '.prettierrc*'
      - '.prettierignore'
      - '.secretlintrc.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'astro.config.*'
      - 'svelte.config.*'
      - 'eslint.config.*'
      - 'knip.json'
      - 'vitest.config.*'
      - 'playwright*.config.ts'
      - '.size-limit.js'
      - '.prettierrc*'
      - '.prettierignore'
      - '.secretlintrc.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format / Lint / Type-check / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier (check only)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Astro / TypeScript check
        run: npm run check

      - name: svelte-check
        run: npm run check:svelte

      - name: Knip (unused files / exports / deps)
        run: npm run knip

      - name: Secretlint (secret scan)
        run: npm run secretlint

      - name: Build
        run: npm run build
        env:
          # Stubs so the build can import API routes; no external calls are made.
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub
          RESEND_API_KEY: stub

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run vitest with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub
          RESEND_API_KEY: stub

      - name: Run Lighthouse CI (desktop)
        run: npm run lighthouse

      - name: Run Lighthouse CI (mobile)
        run: npm run lighthouse:mobile
