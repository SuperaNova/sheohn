name: Bundle Size

# size-limit budgets over the built client output (.size-limit.js); the PR
# comment is posted with the gh CLI.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'svelte.config.*'
      - '.size-limit.js'
      - 'scripts/bundle-size-diff.mjs'
      - '.github/workflows/bundle-size.yml'

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundle-size:
    name: size-limit budgets + PR byte-diff comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            pr/package-lock.json
            base/package-lock.json

      - name: Install dependencies (PR branch)
        working-directory: pr
        run: npm ci --legacy-peer-deps

      - name: Build (PR branch)
        working-directory: pr
        run: npm run build
        env:
          # Stubs so the build can import API routes; no external calls are made.
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub
          RESEND_API_KEY: stub

      - name: Measure PR bundle
        working-directory: pr
        # Must still emit pr-size.json when over budget; enforcement is the later step.
        continue-on-error: true
        run: npx size-limit --json > ../pr-size.json

      - name: Install dependencies (base branch)
        working-directory: base
        # The base may lack .size-limit.js; later steps tolerate a missing base measurement.
        run: npm ci --legacy-peer-deps

      - name: Build (base branch)
        working-directory: base
        run: npm run build
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          UPSTASH_VECTOR_REST_URL: https://stub.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: stub
          UPSTASH_REDIS_REST_URL: https://stub.upstash.io
          UPSTASH_REDIS_REST_TOKEN: stub
          RESEND_API_KEY: stub

      - name: Measure base bundle
        working-directory: base
        continue-on-error: true
        run: npx size-limit --json > ../base-size.json

      - name: Enforce budgets (fails the job on over-budget)
        working-directory: pr
        run: npx size-limit

      - name: Build the PR comment body
        # Cosmetic; must not mask the enforcement result.
        continue-on-error: true
        run: node pr/scripts/bundle-size-diff.mjs pr-size.json base-size.json > comment-body.md

      - name: Comment byte diff on the PR
        # New comment per push: --edit-last would overwrite other workflows' bot comments (e.g. brain.yml).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file comment-body.md
